name: compiler
on: [push, pull_request]
jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        optimization: ['0', '2']
    env:
      GFLAT_OPT_LEVEL: ${{ matrix.optimization }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore
      # Allow cold runner/toolchain startup without prematurely killing passing tests.
      - run: dotnet test --no-restore --blame-hang-timeout 5m --logger trx
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-O${{ matrix.optimization }}
          path: '**/TestResults/**'

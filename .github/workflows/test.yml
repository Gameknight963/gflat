name: compiler
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  compiler-x64:
    name: compiler (${{ matrix.os }}, shard ${{ matrix.shard }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Prepare isolated Windows test directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build/prepare-windows-test-runner.ps1
      - name: Select Linux toolchain
        if: runner.os == 'Linux'
        run: |
          clang-18 --version
          clang-18 --driver-mode=g++ --version
          echo "GFLAT_CLANG=clang-18" >> "$GITHUB_ENV"
      - name: Build tests and create disjoint shard plans
        shell: pwsh
        run: |
          dotnet build gflat.Tests/gflat.Tests.csproj -m:1 -nodeReuse:false
          if ($LASTEXITCODE -ne 0) { throw 'Test build failed' }
          $weights = @()
          $durationFile = 'build/test-durations/${{ runner.os }}.json'
          if (Test-Path $durationFile) { $weights += $durationFile }
          dotnet run --project build/TestPlan -- plan gflat.Tests/bin/Debug/net10.0/gflat.Tests.dll artifacts/test-plan 4 @weights
          if ($LASTEXITCODE -ne 0) { throw 'Test planning failed' }
      - name: Run primary cases, including explicit O0/O2 theories
        run: dotnet test gflat.Tests/gflat.Tests.csproj --no-build --no-restore --settings artifacts/test-plan/${{ matrix.shard }}-primary.runsettings --results-directory artifacts/test-plan/results/primary --blame-hang-timeout 5m --logger trx
      - name: Include observed default compilations in the fallback
        if: ${{ !cancelled() }}
        run: dotnet run --project build/TestPlan --no-build -- fallback artifacts/test-plan ${{ matrix.shard }}
      - name: Run O2 fallback for tests without optimization parameters
        if: ${{ !cancelled() }}
        run: dotnet test gflat.Tests/gflat.Tests.csproj --no-build --no-restore --settings artifacts/test-plan/${{ matrix.shard }}-fallback.runsettings --results-directory artifacts/test-plan/results/fallback --blame-hang-timeout 5m --logger trx
      - name: Summarize stage and test durations
        if: always()
        shell: pwsh
        run: |
          if (!(Test-Path artifacts/test-plan/manifest.json)) { exit 0 }
          dotnet run --project build/TestPlan --no-build -- report artifacts/test-plan
          if ($LASTEXITCODE -ne 0) { throw 'Timing report failed' }
          Get-Content artifacts/test-plan/timings.md | Add-Content $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}-shard-${{ matrix.shard }}
          path: artifacts/test-plan/
  tooling:
    name: tooling (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Prepare isolated Windows test directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build/prepare-windows-test-runner.ps1
      - name: Select Linux toolchain
        if: runner.os == 'Linux'
        run: echo "GFLAT_CLANG=clang-18" >> "$GITHUB_ENV"
      - run: dotnet test gflat.LanguageServer.Tests/gflat.LanguageServer.Tests.csproj --blame-hang-timeout 5m --logger trx
      - name: Build and run Linux projects
        if: runner.os == 'Linux' && !cancelled()
        run: |
          dotnet build gflat/gflat.csproj
          dotnet gflat/bin/Debug/net10.0/gflat.dll build examples/hello/hello.gfproj --run
          dotnet gflat/bin/Debug/net10.0/gflat.dll build examples/interpolation/interpolation.gfproj --run
      - name: Verify compiler shard discovery coverage
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          dotnet build gflat.Tests/gflat.Tests.csproj -m:1 -nodeReuse:false
          if ($LASTEXITCODE -ne 0) { throw 'Test build failed' }
          ./build/TestPlan/test.ps1
      - name: Test bundled tools without installed dotnet or MSBuild
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $runtime = if ($IsWindows) { 'win-x64' } else { 'linux-x64' }
          dotnet publish gflat/gflat.csproj -c Release -r $runtime --self-contained true -o artifacts/standalone/compiler
          if ($LASTEXITCODE -ne 0) { throw 'Compiler publishing failed' }
          ./build/test-bundled-msbuild.ps1 -ToolchainDirectory . -CompilerDirectory artifacts/standalone/compiler
          dotnet publish gflat.LanguageServer/gflat.LanguageServer.csproj -c Release -r $runtime --self-contained true -o artifacts/standalone/server
          if ($LASTEXITCODE -ne 0) { throw 'Language server publishing failed' }
          $server = if ($IsWindows) { 'gflat.LanguageServer.exe' } else { 'gflat.LanguageServer' }
          $env:GFLAT_LSP_EXECUTABLE = Join-Path $PWD "artifacts/standalone/server/$server"
          dotnet test gflat.LanguageServer.Tests/gflat.LanguageServer.Tests.csproj --no-build --filter FullyQualifiedName~ServerTests
          if ($LASTEXITCODE -ne 0) { throw 'Packaged language server tests failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tooling-results-${{ matrix.os }}
          path: '**/TestResults/**'
  visual-studio-extension:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Prepare isolated Windows test directory
        shell: pwsh
        run: ./build/prepare-windows-test-runner.ps1
      - name: Assign automatic VSIX build number
        shell: pwsh
        run: ./build/stamp-vsix.ps1 -RunNumber ${{ github.run_number }} -Attempt ${{ github.run_attempt }}
      - run: ./editors/VisualStudio/build.ps1
      # The VS SDK harness uses .NET Framework APIs, including RealProxy/WPF.
      # GitHub's default pwsh runs on modern .NET and cannot load that harness.
      - name: Test Visual Studio package with the .NET Framework host
        shell: powershell
        run: ./editors/VisualStudio/test-package.ps1 -PackageChecksOnly
      - uses: actions/upload-artifact@v4
        with:
          name: gflat-visual-studio
          path: |
            editors/VisualStudio/bin/Release/net472/*.vsix
            editors/VisualStudio/bin/Release/net472/install-sdk.ps1
            editors/VisualStudio/bin/Release/net472/uninstall-sdk.ps1
            editors/VisualStudio/bin/Release/net472/sdk-paths.ps1
          retention-days: 90
          if-no-files-found: error
  nightly-bundles:
    name: bundle (${{ matrix.runtime }})
    needs: [compiler-x64, tooling, visual-studio-extension]
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            runtime: win-x64
            artifact-path: artifacts/nightly/win-x64/
          - os: ubuntu-24.04
            runtime: linux-x64
            artifact-path: artifacts/nightly/gflat-linux-x64.tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Prepare isolated Windows test directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build/prepare-windows-test-runner.ps1
      - name: Select Linux toolchain
        if: runner.os == 'Linux'
        run: |
          clang-18 --version
          clang-18 --driver-mode=g++ --version
          echo "GFLAT_CLANG=clang-18" >> "$GITHUB_ENV"
      - name: Package and smoke-test compiler bundle
        shell: pwsh
        run: ./build/package-nightly.ps1 -Runtime ${{ matrix.runtime }}
      - uses: actions/upload-artifact@v4
        with:
          name: gflat-${{ matrix.runtime }}
          path: ${{ matrix.artifact-path }}
          retention-days: 90
          if-no-files-found: error
